# Railway config for the WEB service. The worker service uses the same
# repo + Dockerfile with its start command overridden in the dashboard
# to: python -m rivalr.worker
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
